[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-stash"
version = "0.1.0"
description = "Hermes Agent plugin: a tiny autonomous Solana yield stash"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "solders>=0.21,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6"]

[project.scripts]
hermes-stash = "stash.__main__:main"

[tool.setuptools]
packages = ["stash"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
